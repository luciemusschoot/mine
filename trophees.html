<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="steelblue">
</head>
<body>

  <header class="pages">

    <h1 class="pages">Trophées</h1>

    <button id="homeBtn" class="home">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        fill="none"
        stroke="white"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24"
      >

        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9v11h14V9"/>
        <path d="M9 20v-6h6v6"/>

      </svg>

    </button>

  </header>


  <main>

    <section class="profil-niveau">

      <h2>Progression</h2>

      <div class="niveau-trophees">

        <strong id="niveauTrophees">
          Niveau 1
        </strong>

        <span id="xpTrophees">
          0 XP
        </span>

      </div>

    </section>


    <section class="collection-trophees">

      <h2>Mes trophées</h2>

      <div id="listeTrophees" class="trophees-grid"></div>

    </section>

  </main>


  <script>

    // ================================
    // NIVEAU / XP
    // ================================

    function calculerXP() {

      const seances =
        JSON.parse(localStorage.getItem("seances")) || [];

      let xp = 0;

      seances.forEach(seance => {

        if (seance.type === "entrainement") {
          xp += 10;
        }

        if (seance.type === "match") {
          xp += 25;
        }

      });

      return xp;
    }


    function calculerNiveau(xp) {

      if (xp >= 3000) return 10;
      if (xp >= 2350) return 9;
      if (xp >= 1850) return 8;
      if (xp >= 1400) return 7;
      if (xp >= 1000) return 6;
      if (xp >= 700) return 5;
      if (xp >= 450) return 4;
      if (xp >= 250) return 3;
      if (xp >= 100) return 2;

      return 1;
    }


    // ================================
    // CALCUL DES STATISTIQUES
    // ================================

    function recupererStatistiques() {

      const seances =
        JSON.parse(localStorage.getItem("seances")) || [];


      const entrainements =
        seances.filter(
          s => s.type === "entrainement"
        ).length;


      const matchs =
        seances.filter(
          s => s.type === "match" && s.match
        );


      const totalArrets =
        matchs.reduce(
          (total, seance) =>
            total +
            Number(seance.match.nombreArrets || 0),
          0
        );


      const meilleurMatch =
        matchs.length > 0
          ? Math.max(
              ...matchs.map(
                s => Number(s.match.nombreArrets || 0)
              )
            )
          : 0;


      return {
        entrainements,
        matchs: matchs.length,
        totalArrets,
        meilleurMatch
      };

    }


    // ================================
    // TROPHÉES
    // ================================

    const trophees = [

      {
        id: "premier-entrainement",
        titre: "Premiers pas",
        sousTitre: "1 entraînement joué",
        condition: stats =>
          stats.entrainements >= 1
      },

      {
        id: "10-entrainements",
        titre: "Assidue",
        sousTitre: "10 entraînements joués",
        condition: stats =>
          stats.entrainements >= 10
      },

      {
        id: "25-entrainements",
        titre: "Travailleuse",
        sousTitre: "25 entraînements joués",
        condition: stats =>
          stats.entrainements >= 25
      },

      {
        id: "50-entrainements",
        titre: "Machine",
        sousTitre: "50 entraînements joués",
        condition: stats =>
          stats.entrainements >= 50
      },


      {
        id: "50-arrets",
        titre: "Bonne gardienne",
        sousTitre: "50 arrêts en saison",
        condition: stats =>
          stats.totalArrets >= 50
      },

      {
        id: "100-arrets",
        titre: "Mur",
        sousTitre: "100 arrêts en saison",
        condition: stats =>
          stats.totalArrets >= 100
      },

      {
        id: "250-arrets",
        titre: "Rempart",
        sousTitre: "250 arrêts en saison",
        condition: stats =>
          stats.totalArrets >= 250
      },


      {
        id: "10-arrets-match",
        titre: "Gros match",
        sousTitre: "10 arrêts dans un match",
        condition: stats =>
          stats.meilleurMatch >= 10
      },

      {
        id: "15-arrets-match",
        titre: "Muraille",
        sousTitre: "15 arrêts dans un match",
        condition: stats =>
          stats.meilleurMatch >= 15
      },

      {
        id: "20-arrets-match",
        titre: "Infranchissable",
        sousTitre: "20 arrêts dans un match",
        condition: stats =>
          stats.meilleurMatch >= 20
      }

    ];


    // ================================
    // AFFICHAGE DES TROPHÉES
    // ================================

    function afficherTrophees() {

      const stats =
        recupererStatistiques();

      const liste =
        document.getElementById("listeTrophees");

      liste.innerHTML = "";


      trophees.forEach(trophee => {

        if (!trophee.condition(stats)) {
          return;
        }


        const carte =
          document.createElement("div");

        carte.className = "carte-trophee";


        // Date d'obtention
        const tropheesObtenus =
          JSON.parse(
            localStorage.getItem("tropheesObtenus")
          ) || {};


        if (!tropheesObtenus[trophee.id]) {

          tropheesObtenus[trophee.id] =
            new Date().toISOString();

          localStorage.setItem(
            "tropheesObtenus",
            JSON.stringify(tropheesObtenus)
          );

        }


        const dateObtention =
          new Date(
            tropheesObtenus[trophee.id]
          );


        const dateFormatee =
          dateObtention.toLocaleDateString(
            "fr-FR",
            {
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          );


        carte.innerHTML = `

          <div class="badge-trophee">
            🏆
          </div>

          <h3>
            ${trophee.titre}
          </h3>

          <p class="sous-titre-trophee">
            ${trophee.sousTitre}
          </p>

          <p class="date-trophee">
            Obtenu le ${dateFormatee}
          </p>

        `;


        liste.appendChild(carte);

      });

    }


    // ================================
    // AFFICHER LE NIVEAU
    // ================================

    const xp = calculerXP();
    const niveau = calculerNiveau(xp);


    document.getElementById(
      "niveauTrophees"
    ).textContent =
      "Niveau " + niveau;


    document.getElementById(
      "xpTrophees"
    ).textContent =
      xp + " XP";


    afficherTrophees();


    // ================================
    // RETOUR ACCUEIL
    // ================================

    document.getElementById("homeBtn")
      .addEventListener("click", () => {

        window.location.href =
          "index.html";

      });

  </script>

</body>
</html>
