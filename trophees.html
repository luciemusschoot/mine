  <script>

// ================================
// NIVEAU / XP
// ================================

function calculerXP() {

  const seances =
    JSON.parse(localStorage.getItem("seances")) || [];

  let xp = 0;

  seances.forEach(seance => {

    if (seance.type === "entrainement") {
      xp += 10;
    }

    if (seance.type === "match") {
      xp += 25;
    }

  });

  return xp;
}


function obtenirInfosNiveau(xp) {

  const niveaux = [
    { niveau: 1, xp: 0 },
    { niveau: 2, xp: 50 },
    { niveau: 3, xp: 150 },
    { niveau: 4, xp: 300 },
    { niveau: 5, xp: 500 },
    { niveau: 6, xp: 750 },
    { niveau: 7, xp: 1050 },
    { niveau: 8, xp: 1400 },
    { niveau: 9, xp: 1800 },
    { niveau: 10, xp: 2250 },
    { niveau: 11, xp: 2750 },
    { niveau: 12, xp: 3300 },
    { niveau: 13, xp: 3900 },
    { niveau: 14, xp: 4550 },
    { niveau: 15, xp: 5250 },
    { niveau: 16, xp: 6000 },
    { niveau: 17, xp: 6800 },
    { niveau: 18, xp: 7650 },
    { niveau: 19, xp: 8550 },
    { niveau: 20, xp: 9500 },
    { niveau: 21, xp: 10500 },
    { niveau: 22, xp: 11550 },
    { niveau: 23, xp: 12650 },
    { niveau: 24, xp: 13800 },
    { niveau: 25, xp: 15000 },
    { niveau: 26, xp: 16250 },
    { niveau: 27, xp: 17550 },
    { niveau: 28, xp: 18900 },
    { niveau: 29, xp: 20300 },
    { niveau: 30, xp: 21750 }
  ];

  let niveauActuel = niveaux[0];
  let prochainNiveau = null;

  for (let i = 0; i < niveaux.length; i++) {

    if (xp >= niveaux[i].xp) {
      niveauActuel = niveaux[i];
    }

    if (xp < niveaux[i].xp) {
      prochainNiveau = niveaux[i];
      break;
    }

  }

  return {
    niveauActuel,
    prochainNiveau
  };
}


function afficherNiveauTrophees() {

  const xp = calculerXP();

  const infos = obtenirInfosNiveau(xp);

  // Niveau actuel
  document.getElementById("niveauTrophees").textContent =
    "Niveau " + infos.niveauActuel.niveau;


  // Niveau maximum
  if (!infos.prochainNiveau) {

    document.getElementById("progressionXPTrophees").style.width =
      "100%";

    document.getElementById("prochainNiveauTrophees").textContent =
      "Niveau maximum atteint !";

    return;
  }


  // XP au début du niveau actuel
  const xpDebut =
    infos.niveauActuel.xp;

  // XP nécessaire pour atteindre le prochain niveau
  const xpFin =
    infos.prochainNiveau.xp;


  // XP gagnée depuis le début du niveau
  const xpDansLeNiveau =
    xp - xpDebut;


  // XP nécessaire pour passer au niveau suivant
  const xpNecessaire =
    xpFin - xpDebut;


  // Pourcentage de progression
  const pourcentage =
    (xpDansLeNiveau / xpNecessaire) * 100;


  // Barre de progression
  document.getElementById("progressionXPTrophees").style.width =
    pourcentage + "%";


  // Texte sous la barre
  document.getElementById("prochainNiveauTrophees").textContent =
    `${xpDansLeNiveau} / ${xpNecessaire} XP`;
}


// Affichage au chargement
afficherNiveauTrophees();

    function calculerNiveau(xp) {

      if (xp >= 21750) return 30;
      if (xp >= 20300) return 29;
      if (xp >= 18900) return 28;
      if (xp >= 17550) return 27;
      if (xp >= 16250) return 26;

      if (xp >= 150) return 3;
      if (xp >= 50) return 2;

      return 1;

// ================================
// CALCUL DES STATISTIQUES
// ================================

function recupererStatistiques(seancesSource = null) {

  const seances =
    seancesSource ||
    JSON.parse(localStorage.getItem("seances")) ||
    [];


  // On travaille toujours dans l'ordre chronologique
  const seancesChronologiques = [...seances]
    .sort((a, b) => new Date(a.date) - new Date(b.date));


  // ================================
  // ENTRAÎNEMENTS
  // ================================

  const entrainements =
    seancesChronologiques.filter(
      s => s.type === "entrainement"
    );


  // ================================
  // MATCHS
  // ================================

  const matchs =
    seancesChronologiques.filter(
      s => s.type === "match" && s.match
    );


  // ================================
  // XP / NIVEAU
  // ================================

  let xp = 0;

  seancesChronologiques.forEach(seance => {

    if (seance.type === "entrainement") {
      xp += 10;
    }

    if (seance.type === "match") {
      xp += 25;
    }

  });

  const niveau = calculerNiveau(xp);


  // ================================
  // ARRÊTS
  // ================================

  const totalArrets =
    matchs.reduce(
      (total, seance) =>
        total +
        Number(seance.match.nombreArrets || 0),
      0
    );


  const meilleurMatch =
    matchs.length > 0
      ? Math.max(
          ...matchs.map(
            s => Number(s.match.nombreArrets || 0)
          )
        )
      : 0;


  // ================================
  // POURCENTAGES
  // ================================

  const pourcentages =
    matchs.map(
      s => Number(
        s.match.pourcentageArrets || 0
      )
    );


  const meilleurPourcentage =
    pourcentages.length > 0
      ? Math.max(...pourcentages)
      : 0;


  // ================================
  // MATCHS AVEC 10 ARRÊTS
  // ================================

  const matchsAvec10Arrets =
    matchs.filter(
      s =>
        Number(s.match.nombreArrets || 0) >= 10
    ).length;


  // ================================
  // MATCHS À 70 % ET 80 %
  // ================================

  const matchs70 =
    matchs.filter(
      s =>
        Number(s.match.pourcentageArrets || 0) >= 70
    ).length;


  const matchs80 =
    matchs.filter(
      s =>
        Number(s.match.pourcentageArrets || 0) >= 80
    ).length;


  // ================================
  // SÉRIE À 60 %
  // ================================

  let serie60 = 0;
  let meilleureSerie60 = 0;

  matchs.forEach(match => {

    const pourcentage =
      Number(
        match.match.pourcentageArrets || 0
      );

    if (pourcentage >= 60) {

      serie60++;

      if (serie60 > meilleureSerie60) {
        meilleureSerie60 = serie60;
      }

    } else {

      serie60 = 0;

    }

  });


  // ================================
  // SÉRIE AVEC AU MOINS 1 ARRÊT
  // ================================

  let serieArret = 0;
  let meilleureSerieAvecArret = 0;

  matchs.forEach(match => {

    const arrets =
      Number(
        match.match.nombreArrets || 0
      );

    if (arrets >= 1) {

      serieArret++;

      if (serieArret > meilleureSerieAvecArret) {
        meilleureSerieAvecArret =
          serieArret;
      }

    } else {

      serieArret = 0;

    }

  });


  // ================================
  // 3 PREMIERS MATCHS AVEC 5 ARRÊTS
  // ================================

  const troisPremiersMatchs =
    matchs.slice(0, 3);

  const matchsAvec5ArretsPremiers =
    troisPremiersMatchs.length === 3 &&
    troisPremiersMatchs.every(
      match =>
        Number(match.match.nombreArrets || 0) >= 5
    )
      ? 3
      : 0;


  // ================================
  // FOCUS
  // ================================

  const focusUtilises =
    entrainements
      .map(s => s.focus)
      .filter(
        focus =>
          focus &&
          focus.trim() !== ""
      );


  const focusUniques =
    [...new Set(focusUtilises)];


  const nombreFocus =
    focusUniques.length;


  // Nombre maximum d'entraînements
  // avec le même focus

  const compteurFocus = {};

  entrainements.forEach(seance => {

    if (!seance.focus) {
      return;
    }

    compteurFocus[seance.focus] =
      (compteurFocus[seance.focus] || 0) + 1;

  });


  const valeursFocus =
    Object.values(compteurFocus);


  const meilleurFocus =
    valeursFocus.length > 0
      ? Math.max(...valeursFocus)
      : 0;


  // ================================
  // MÊME FOCUS + 4 ÉTOILES
  // ================================

  const compteurFocus4Etoiles = {};

  entrainements.forEach(seance => {

    if (!seance.focus) {
      return;
    }

    const note =
      Number(seance.note || 0);

    if (note >= 4) {

      compteurFocus4Etoiles[seance.focus] =
        (compteurFocus4Etoiles[seance.focus] || 0) + 1;

    }

  });


  const valeursFocus4Etoiles =
    Object.values(compteurFocus4Etoiles);


  const meilleurFocus4Etoiles =
    valeursFocus4Etoiles.length > 0
      ? Math.max(...valeursFocus4Etoiles)
      : 0;


  // ================================
  // NOTES
  // ================================

  const seances5Etoiles =
    seancesChronologiques.filter(
      s => Number(s.note || 0) === 5
    ).length;


  const seances4Etoiles =
    seancesChronologiques.filter(
      s => Number(s.note || 0) >= 4
    ).length;


  // ================================
  // SÉRIE DE 5 ÉTOILES
  // ================================

  let serie5Etoiles = 0;
  let meilleureSerie5Etoiles = 0;

  seancesChronologiques.forEach(seance => {

    if (Number(seance.note || 0) === 5) {

      serie5Etoiles++;

      if (serie5Etoiles > meilleureSerie5Etoiles) {
        meilleureSerie5Etoiles =
          serie5Etoiles;
      }

    } else {

      serie5Etoiles = 0;

    }

  });


  // ================================
  // SÉANCES SUR UNE PÉRIODE
  // ================================

  function maximumSeancesDansNombreDeJours(nombreDeJours) {

    let maximum = 0;

    for (
      let i = 0;
      i < seancesChronologiques.length;
      i++
    ) {

      const dateFin =
        new Date(
          seancesChronologiques[i].date
        );

      let compteur = 0;

      for (
        let j = 0;
        j < seancesChronologiques.length;
        j++
      ) {

        const dateDebut =
          new Date(
            seancesChronologiques[j].date
          );

        const difference =
          Math.abs(
            dateFin - dateDebut
          ) /
          (1000 * 60 * 60 * 24);

        if (difference <= nombreDeJours) {
          compteur++;
        }

      }

      if (compteur > maximum) {
        maximum = compteur;
      }

    }

    return maximum;

  }


  const maxSeances30Jours =
    maximumSeancesDansNombreDeJours(30);


  const maxSeances14Jours =
    maximumSeancesDansNombreDeJours(14);


  // ================================
  // 3 SÉANCES DANS UNE MÊME SEMAINE
  // ================================

  const semaines = {};

  seancesChronologiques.forEach(seance => {

    const date =
      new Date(seance.date);

    const jour =
      date.getDay() || 7;

    const lundi =
      new Date(date);

    lundi.setDate(
      date.getDate() - jour + 1
    );

    const cle =
      lundi.toISOString().split("T")[0];

    semaines[cle] =
      (semaines[cle] || 0) + 1;

  });


  const valeursSemaines =
    Object.values(semaines);


  const maxSeancesSemaine =
    valeursSemaines.length > 0
      ? Math.max(...valeursSemaines)
      : 0;


  // ================================
  // RETOUR APRÈS 14 JOURS DE PAUSE
  // ================================

  let aReprisApresPause = false;

  for (
    let i = 1;
    i < seancesChronologiques.length;
    i++
  ) {

    const precedente =
      new Date(
        seancesChronologiques[i - 1].date
      );

    const actuelle =
      new Date(
        seancesChronologiques[i].date
      );

    const difference =
      (
        actuelle - precedente
      ) /
      (1000 * 60 * 60 * 24);


    if (difference >= 14) {

      aReprisApresPause = true;
      break;

    }

  }


  // ================================
  // 4 SEMAINES CONSÉCUTIVES
  // ================================

  const semainesPresentes =
    new Set();

  seancesChronologiques.forEach(seance => {

    const date =
      new Date(seance.date);

    const jour =
      date.getDay() || 7;

    const lundi =
      new Date(date);

    lundi.setDate(
      date.getDate() - jour + 1
    );

    const cle =
      lundi.toISOString().split("T")[0];

    semainesPresentes.add(cle);

  });


  const semainesTriees =
    [...semainesPresentes]
      .sort();


  let serieSemaines = 0;
  let meilleureSerieSemaines = 0;

  for (
    let i = 0;
    i < semainesTriees.length;
    i++
  ) {

    if (i === 0) {

      serieSemaines = 1;

    } else {

      const precedente =
        new Date(
          semainesTriees[i - 1]
        );

      const actuelle =
        new Date(
          semainesTriees[i]
        );

      const difference =
        Math.round(
          (
            actuelle - precedente
          ) /
          (1000 * 60 * 60 * 24)
        );

      if (difference === 7) {

        serieSemaines++;

      } else {

        serieSemaines = 1;

      }

    }


    if (serieSemaines > meilleureSerieSemaines) {
      meilleureSerieSemaines =
        serieSemaines;
    }

  }


  // ================================
  // RETOUR DES STATISTIQUES
  // ================================

  return {

    totalSeances:
      seancesChronologiques.length,

    entrainements:
      entrainements.length,

    matchs:
      matchs.length,

    totalArrets,

    meilleurMatch,

    meilleurPourcentage,

    matchsAvec10Arrets,

    matchs70,

    matchs80,

    meilleureSerie60,

    meilleureSerieAvecArret,

    matchsAvec5ArretsPremiers,

    nombreFocus,

    meilleurFocus,

    meilleurFocus4Etoiles,

    seances5Etoiles,

    seances4Etoiles,

    meilleureSerie5Etoiles,

    maxSeances30Jours,

    maxSeances14Jours,

    maxSeancesSemaine,

    aReprisApresPause,

    meilleureSerieSemaines,

    xp,

    niveau

  };

}

// ================================
// DATE EXACTE D'OBTENTION
// ================================

function trouverDateObtention(trophee) {

  const seances =
    JSON.parse(localStorage.getItem("seances")) || [];


  const seancesChronologiques =
    [...seances].sort(
      (a, b) =>
        new Date(a.date) - new Date(b.date)
    );


  // On ajoute les séances une par une.
  // Dès que la condition devient vraie,
  // la dernière séance est celle qui
  // débloque le trophée.

  for (
    let i = 0;
    i < seancesChronologiques.length;
    i++
  ) {

    const historique =
      seancesChronologiques.slice(
        0,
        i + 1
      );


    const stats =
      recupererStatistiques(
        historique
      );


    if (trophee.condition(stats)) {

      return seancesChronologiques[i].date;

    }

  }


  return null;

}

// ================================
// AFFICHAGE DES TROPHÉES
// ================================

function afficherTrophees() {

  const seances =
    JSON.parse(localStorage.getItem("seances")) || [];

  const stats =
    recupererStatistiques(seances);

  const liste =
    document.getElementById("listeTrophees");

  liste.innerHTML = "";


  // ================================
  // TROPHÉES DÉJÀ ENREGISTRÉS
  // ================================

  const tropheesObtenus =
    JSON.parse(
      localStorage.getItem("tropheesObtenus")
    ) || {};


  // ================================
  // TRI DES TROPHÉES
  // ================================

  const tropheesTries =
    [...trophees].sort((a, b) => {

      const obtenuA =
        a.condition(stats);

      const obtenuB =
        b.condition(stats);

      return obtenuB - obtenuA;

    });


  tropheesTries.forEach(trophee => {

    // ================================
    // ÉTAT DU TROPHÉE
    // ================================

    const obtenu =
      trophee.condition(stats);


    // ================================
    // DATE D'OBTENTION
    // ================================

    let dateFormatee = "";


    if (obtenu) {

      /*
       * Le trophée est actuellement obtenu.
       *
       * S'il n'a pas encore de date enregistrée,
       * on recherche la séance exacte qui l'a déclenché.
       */

      if (!tropheesObtenus[trophee.id]) {

        const dateExacte =
          trouverDateObtention(trophee);

        if (dateExacte) {

          tropheesObtenus[trophee.id] =
            dateExacte;

        }

      }


    } else {

      /*
       * IMPORTANT :
       *
       * Le trophée n'est plus obtenu.
       * On supprime donc son ancienne date.
       *
       * Ainsi, s'il est obtenu à nouveau plus tard,
       * une nouvelle date sera calculée.
       */

      delete tropheesObtenus[trophee.id];

    }


    // ================================
    // SAUVEGARDE
    // ================================

    localStorage.setItem(
      "tropheesObtenus",
      JSON.stringify(tropheesObtenus)
    );


    // ================================
    // PROGRESSION
    // ================================

    let actuel = 0;
    let objectif = 1;
    let unite = "";


    if (trophee.progression) {

      const progression =
        trophee.progression(stats);


      actuel =
        Number(progression.actuel) || 0;

      objectif =
        Number(progression.objectif) || 1;

      unite =
        progression.unite || "";

    }


    // ================================
    // POURCENTAGE
    // ================================

    const pourcentage =
      Math.min(
        100,
        Math.max(
          0,
          Math.round(
            (actuel / objectif) * 100
          )
        )
      );


    // ================================
    // FORMATAGE DATE
    // ================================

    if (
      obtenu &&
      tropheesObtenus[trophee.id]
    ) {

      const dateObtention =
        new Date(
          tropheesObtenus[trophee.id]
        );


      dateFormatee =
        dateObtention.toLocaleDateString(
          "fr-FR",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

    }


    // ================================
    // CARTE
    // ================================

    const carte =
      document.createElement("div");


    carte.className =
      obtenu
        ? "carte-trophee obtenu"
        : "carte-trophee non-obtenu";


    // ================================
    // TEXTE DE PROGRESSION
    // ================================

    let texteProgression = "";


    if (objectif > 1) {

      texteProgression =
        `${Math.min(actuel, objectif)}${unite} / ${objectif}${unite}`;

    } else {

      texteProgression =
        `${Math.min(actuel, objectif)} / ${objectif}`;

    }


    // ================================
    // HTML DE LA CARTE
    // ================================

    carte.innerHTML = `

      <div class="badge-trophee">
        🏆
      </div>

      <h3>
        ${trophee.titre}
      </h3>

      <p class="sous-titre-trophee">
        ${trophee.sousTitre}
      </p>


      ${
        !obtenu
          ? `
            <div class="progression-trophee">

              <div class="barre-progression">

                <div
                  class="barre-progression-remplie"
                  style="width: ${pourcentage}%"
                ></div>

              </div>

              <div class="texte-progression">
                ${texteProgression}
              </div>

            </div>
          `
          : ""
      }


      ${
        obtenu
          ? `
            <p class="date-trophee">
              ✓ ${dateFormatee}
            </p>
          `
          : `
            <p class="trophee-verrouille">
              Non obtenu
            </p>
          `
      }

    `;


    // ================================
    // AJOUT À LA LISTE
    // ================================

    liste.appendChild(carte);

  });

}
    afficherTrophees();
  </script>
