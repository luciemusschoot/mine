<script>
  // Date du jour
  const date = new Date();

  document.getElementById("dateDuJour").textContent =
    date.toLocaleDateString("fr-FR", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });


  // Éléments du formulaire
  const bouton = document.getElementById("NouvSeanceBtn");
  const formulaire = document.getElementById("formulaireSeance");
  const fermer = document.getElementById("fermerFormulaire");
  const enregistrer = document.getElementById("enregistrerSeance");
  const etoiles = document.querySelectorAll("#ressenti span");

  // Champs spécifiques aux matchs
  const champsMatch = document.getElementById("champsMatch");
  const adversaire = document.getElementById("adversaire");
  const scoreNous = document.getElementById("scoreNous");
  const scoreAdversaire = document.getElementById("scoreAdversaire");
  const nombreArrets = document.getElementById("nombreArrets");
  const statsArrets = document.getElementById("statsArrets");

  const typesSeance = document.querySelectorAll('input[name="typeSeance"]');


  // Afficher / cacher les champs du match
  typesSeance.forEach(type => {

    type.addEventListener("change", () => {

      if (type.value === "match" && type.checked) {
        champsMatch.style.display = "block";

        adversaire.required = true;
        scoreNous.required = true;
        scoreAdversaire.required = true;
        nombreArrets.required = true;

      } else if (type.value === "entrainement" && type.checked) {
        champsMatch.style.display = "none";

        adversaire.required = false;
        scoreNous.required = false;
        scoreAdversaire.required = false;
        nombreArrets.required = false;

        // Nettoyage des champs
        adversaire.value = "";
        scoreNous.value = "";
        scoreAdversaire.value = "";
        nombreArrets.value = "";
        statsArrets.value = "";
      }

    });

  });


  // Calcul automatique du pourcentage d'arrêts
  function calculerStatsArrets() {

    const arrets = Number(nombreArrets.value);
    const butsEncaisses = Number(scoreAdversaire.value);

    if (
      nombreArrets.value !== "" &&
      scoreAdversaire.value !== ""
    ) {

      const totalTirs = arrets + butsEncaisses;

      if (totalTirs > 0) {

        const pourcentage =
          (arrets / totalTirs) * 100;

        statsArrets.value =
          pourcentage.toFixed(1) + " %";

      } else {
        statsArrets.value = "0 %";
      }

    } else {
      statsArrets.value = "";
    }
  }


  // Recalculer dès qu'une valeur change
  nombreArrets.addEventListener("input", calculerStatsArrets);
  scoreAdversaire.addEventListener("input", calculerStatsArrets);

  // Ouvrir le formulaire
  bouton.addEventListener("click", () => {
    formulaire.reset();

    // Reset des étoiles
    etoiles.forEach(etoile => {
      etoile.classList.remove("active");
    });

    // Cacher les champs du match
    champsMatch.style.display = "none";

    formulaire.style.display = "flex";
  });

  // Fermer / annuler
  fermer.addEventListener("click", () => {
    formulaire.reset();

    // Reset des étoiles
    etoiles.forEach(etoile => {
      etoile.classList.remove("active");
    });

    // Cacher les champs du match
    champsMatch.style.display = "none";

    formulaire.style.display = "none";
  });


  // Sélection des étoiles
  etoiles.forEach(etoile => {

    etoile.addEventListener("click", () => {

      const valeur = etoile.dataset.value;

      etoiles.forEach(e => {
        e.classList.toggle(
          "active",
          e.dataset.value <= valeur
        );
      });

    });

  });


  // Vérification avant enregistrement
  enregistrer.addEventListener("click", (event) => {

  const etoilesActives =
    document.querySelectorAll("#ressenti span.active");

  const typeSeance =
    document.querySelector('input[name="typeSeance"]:checked');

  const dateSeance =
    document.getElementById("dateSeance").value;

  const commentaire =
    document.getElementById("commentaire").value;

  // Informations du match
  let infosMatch = null;

  if (typeSeance.value === "match") {

    const adversaireValue = adversaire.value.trim();
    const scoreNousValue = Number(scoreNous.value);
    const scoreAdversaireValue = Number(scoreAdversaire.value);
    const nombreArretsValue = Number(nombreArrets.value);

    // Vérification
    if (
      !adversaireValue ||
      scoreNous.value === "" ||
      scoreAdversaire.value === "" ||
      nombreArrets.value === ""
    ) {
      event.preventDefault();
      alert("Complète toutes les informations du match.");
      return;
    }

    const totalTirs =
      nombreArretsValue + scoreAdversaireValue;

    const pourcentageArrets =
      totalTirs > 0
        ? (nombreArretsValue / totalTirs) * 100
        : 0;

    infosMatch = {
      adversaire: adversaireValue,
      score: `${scoreNousValue}-${scoreAdversaireValue}`,
      scoreNous: scoreNousValue,
      scoreAdversaire: scoreAdversaireValue,
      nombreArrets: nombreArretsValue,
      pourcentageArrets: Number(pourcentageArrets.toFixed(1))
    };
  }

  // Vérification de la note
  if (etoilesActives.length === 0) {
    event.preventDefault();
    alert("Donne une note à ta séance.");
    return;
  }

  // Récupérer les anciennes séances
  const seances =
    JSON.parse(localStorage.getItem("seances")) || [];


  // Créer la nouvelle séance
  const nouvelleSeance = {
    date: dateSeance,
    type: typeSeance.value,
    focus: focusSeance.value,
    note: etoilesActives.length,
    commentaire: commentaire,
    match: infosMatch
  };

  // Ajouter la séance
  seances.push(nouvelleSeance);

  // Sauvegarder
  localStorage.setItem(
    "seances",
    JSON.stringify(seances)
  );

  // Mettre à jour les statistiques de saison
  calculerStatsSaison();

  // Fermer et nettoyer
  formulaire.reset();

  etoiles.forEach(etoile => {
    etoile.classList.remove("active");
  });

  formulaire.style.display = "none";

});
// ================================
// STATISTIQUES AUTOMATIQUES DE SAISON
// ================================

function calculerStatsSaison() {

  // Récupérer toutes les séances enregistrées
  const seances = JSON.parse(localStorage.getItem("seances")) || [];

  // Garder uniquement les matchs
  const matchs = seances.filter(
    seance => seance.type === "match" && seance.match
  );

  // Éléments HTML
  const totalArretsElement = document.getElementById("totalArrets");
  const pourcentageMoyenElement = document.getElementById("pourcentageMoyen");
  const moyenneArretsElement = document.getElementById("moyenneArrets");

  // Aucun match enregistré
  if (matchs.length === 0) {
    totalArretsElement.textContent = "0";
    pourcentageMoyenElement.textContent = "0%";
    moyenneArretsElement.textContent = "0";
    return;
  }

  // Total des arrêts
  const totalArrets = matchs.reduce(
    (total, seance) => total + Number(seance.match.nombreArrets || 0),
    0
  );

  // Moyenne d'arrêts par match
  const moyenneArrets = totalArrets / matchs.length;

  // Moyenne des pourcentages d'arrêts
  const pourcentageMoyen =
    matchs.reduce(
      (total, seance) =>
        total + Number(seance.match.pourcentageArrets || 0),
      0
    ) / matchs.length;

  // Affichage
  totalArretsElement.textContent = totalArrets;

  pourcentageMoyenElement.textContent =
    pourcentageMoyen.toFixed(1).replace(".", ",") + "%";

  moyenneArretsElement.textContent =
    moyenneArrets.toFixed(1).replace(".", ",");
}

// Calculer les statistiques au chargement de la page
calculerStatsSaison();

// ================================
// GESTION DES FOCUS
// ================================

const listeFocusElement = document.getElementById("listeFocus");
const nouveauFocusInput = document.getElementById("nouveauFocus");
const ajouterFocusBtn = document.getElementById("ajouterFocus");
const focusSeance = document.getElementById("focusSeance");


// Récupérer les focus enregistrés
function recupererFocus() {
  return JSON.parse(localStorage.getItem("focus")) || [];
}


// Sauvegarder les focus
function sauvegarderFocus(focus) {
  localStorage.setItem("focus", JSON.stringify(focus));
}


// Afficher les focus dans "Focus actuel"
function afficherFocus() {

  const focus = recupererFocus();

  listeFocusElement.innerHTML = "";

  if (focus.length === 0) {
    listeFocusElement.innerHTML =
      "<p class='aucun-focus'>Aucun focus enregistré.</p>";
    return;
  }

  focus.forEach((nomFocus, index) => {

    const ligne = document.createElement("div");
    ligne.className = "focus-item";

    ligne.innerHTML = `
      <span>${nomFocus}</span>

      <button
        type="button"
        class="supprimer-focus"
        data-index="${index}"
        aria-label="Supprimer le focus"
      >
        ×
      </button>
    `;

    listeFocusElement.appendChild(ligne);
  });

  // Boutons supprimer
  document.querySelectorAll(".supprimer-focus").forEach(button => {

    button.addEventListener("click", () => {

      const index = Number(button.dataset.index);

      const focus = recupererFocus();

      focus.splice(index, 1);

      sauvegarderFocus(focus);

      afficherFocus();
      remplirSelectFocus();
    });
  });
}


// Remplir la liste déroulante du formulaire
function remplirSelectFocus() {

  const focus = recupererFocus();

  focusSeance.innerHTML = `
    <option value="">⎼ Choisir un focus ⎼</option>
  `;

  focus.forEach(nomFocus => {

    const option = document.createElement("option");

    option.value = nomFocus;
    option.textContent = nomFocus;

    focusSeance.appendChild(option);
  });
}


// Ajouter un focus
ajouterFocusBtn.addEventListener("click", () => {

  const nomFocus = nouveauFocusInput.value.trim();

  if (!nomFocus) {
    alert("Écris un focus avant de l'ajouter.");
    return;
  }

  const focus = recupererFocus();

  // Éviter les doublons
  if (focus.includes(nomFocus)) {
    alert("Ce focus existe déjà.");
    return;
  }

  focus.push(nomFocus);

  sauvegarderFocus(focus);

  nouveauFocusInput.value = "";

  afficherFocus();
  remplirSelectFocus();
});


// Ajouter avec la touche Entrée
nouveauFocusInput.addEventListener("keydown", event => {

  if (event.key === "Enter") {
    event.preventDefault();
    ajouterFocusBtn.click();
  }

});


// Affichage initial
afficherFocus();
remplirSelectFocus();

// ================================
// NIVEAU ET BARRE D'XP
// ================================

function calculerXP() {

  const seances =
    JSON.parse(localStorage.getItem("seances")) || [];

  let xp = 0;

  seances.forEach(seance => {

    if (seance.type === "entrainement") {
      xp += 10;
    }

    if (seance.type === "match") {
      xp += 25;
    }

  });

  return xp;
}


function obtenirInfosNiveau(xp) {

  const niveaux = [
    { niveau: 1, xp: 0 },
    { niveau: 2, xp: 100 },
    { niveau: 3, xp: 250 },
    { niveau: 4, xp: 450 },
    { niveau: 5, xp: 700 },
    { niveau: 6, xp: 1000 },
    { niveau: 7, xp: 1400 },
    { niveau: 8, xp: 1850 },
    { niveau: 9, xp: 2350 },
    { niveau: 10, xp: 3000 }
  ];

  let niveauActuel = niveaux[0];
  let prochainNiveau = null;

  for (let i = 0; i < niveaux.length; i++) {

    if (xp >= niveaux[i].xp) {
      niveauActuel = niveaux[i];
    }

    if (xp < niveaux[i].xp) {
      prochainNiveau = niveaux[i];
      break;
    }
  }

  return {
    niveauActuel,
    prochainNiveau
  };
}


function afficherNiveau() {

  const xp = calculerXP();

  const infos =
    obtenirInfosNiveau(xp);

  const niveau =
    infos.niveauActuel.niveau;

  document.getElementById("niveauJoueur").textContent =
    "Niveau " + niveau;

  document.getElementById("xpJoueur").textContent =
    xp + " XP";


  // Niveau maximum
  if (!infos.prochainNiveau) {

    document.getElementById("progressionXP").style.width =
      "100%";

    document.getElementById("prochainNiveau").textContent =
      "Niveau maximum atteint !";

    return;
  }


  const xpDebut =
    infos.niveauActuel.xp;

  const xpFin =
    infos.prochainNiveau.xp;


  const xpDansLeNiveau =
    xp - xpDebut;

  const xpNecessaire =
    xpFin - xpDebut;


  const pourcentage =
    (xpDansLeNiveau / xpNecessaire) * 100;


  document.getElementById("progressionXP").style.width =
    pourcentage + "%";


  document.getElementById("prochainNiveau").textContent =
    `${xpFin - xp} XP pour le niveau ${infos.prochainNiveau.niveau}`;
}


afficherNiveau();
