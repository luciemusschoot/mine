<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="steelblue">
</head>
<body>

  <header class="pages">
    <h1 class="pages">Journal</h1>
    <button id="homeBtn" class="home">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9v11h14V9"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </button>
  </header>

  <main>
    <button class="trophées">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24">
        <path d="M18 4H6V7C6 10.3 8.1 13.1 11 13.8V17H8V20H16V17H13V13.8C15.9 13.1 18 10.3 18 7V4ZM8 7V6H10V8C10 9.2 9.5 10.3 8.7 11C8.3 10.2 8 9.2 8 7ZM16 7C16 9.2 15.7 10.2 15.3 11C14.5 10.3 14 9.2 14 8V6H16V7Z"/>
      </svg>
    </button>

    <div id="listeSeances"></div>

  </main>
    
<script>
  document.getElementById("homeBtn").addEventListener("click", () => {
    window.location.href = "index.html";
  });
</script>
<script>
  const listeSeances = document.getElementById("listeSeances");

  const seances = JSON.parse(localStorage.getItem("seances")) || [];
  seances
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .forEach(seance => {

    const carte = document.createElement("div");
    carte.classList.add("carte-seance");

    const date = new Date(seance.date);

    const dateFormatee = date.toLocaleDateString("fr-FR", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    const etoiles =
      "★".repeat(seance.note) +
      "☆".repeat(5 - seance.note);

  carte.innerHTML = `
    <div class="seance-header">

      <h2>${dateFormatee}</h2>

      <button 
        class="supprimer-seance"
        data-date="${seance.date}"
        title="Supprimer">
        ×
      </button>

    </div>

    <p class="type">
      ${seance.type === "match" ? "Match" : "Entraînement"}
    </p>

    <p class="focus-journal">
      <strong>Focus :</strong>
      ${seance.focus || "Aucun focus"}
    </p>

    ${
      seance.type === "match" && seance.match
        ? `
          <div class="infos-match">

            <p>
              <strong>Adversaire :</strong>
              ${seance.match.adversaire}
            </p>

            <p>
              <strong>Score :</strong>
              ${seance.match.score}
            </p>

            <p>
              <strong>Arrêts :</strong>
              ${seance.match.nombreArrets}
            </p>

            <p>
              <strong>Statistiques :</strong>
              ${seance.match.pourcentageArrets} %
            </p>

          </div>
        `
        : ""
    }

  <p class="etoiles-journal">
    ${etoiles}
  </p>

  <p class="commentaire-journal">
    ${seance.commentaire || ""}
  </p>
`;

    // Bouton supprimer
    const boutonSupprimer =
      carte.querySelector(".supprimer-seance");

    boutonSupprimer.addEventListener("click", () => {

      if (!confirm("Supprimer cette séance ?")) {
        return;
      }

      const seances =
        JSON.parse(localStorage.getItem("seances")) || [];

      const nouvellesSeances =
        seances.filter(s => s.date !== seance.date);

      localStorage.setItem(
        "seances",
        JSON.stringify(nouvellesSeances)
      );

      carte.remove();

    });

    listeSeances.appendChild(carte);

  });
</script>
</html>
